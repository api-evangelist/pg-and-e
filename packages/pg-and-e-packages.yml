note: >-
  PG&E ships two FIRST-PARTY Share My Data SDKs, but distributes neither through a package registry.
  Both are unversioned ZIP downloads from pge.com with a matching PDF development guide. Searched
  npm (registry.npmjs.org search for pge / greenbutton / green-button / espi), PyPI, and the
  github.com/pgetech organization on 2026-09-17: no first-party PG&E package exists on any registry,
  and github.com/pgetech (HTTP 200) publishes zero public repositories. Because the ZIPs carry no
  version in the filename, no registry metadata endpoint, and no CDN JSON API, `version` and
  `published` are recorded as null — checked, nothing to record. A consumer cannot tell which build
  of these SDKs they are downloading either; that is the finding.
