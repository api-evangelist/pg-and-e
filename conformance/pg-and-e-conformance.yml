specification: API Commons Conformance
specificationVersion: '0.1'
provider: pg-and-e
providerId: pg-and-e
generated: '2026-09-17'
method: searched
source: https://www.pge.com/en/save-energy-and-money/energy-saving-programs/smartmeter/third-party-companies.html
modified: '2026-09-17'
note: >-
  Share My Data is one of the clearest domain-standard signatures in the United States utility
  sector: the contract itself declares the standard. The granted OAuth scope is an ESPI
  function-block string, the payloads are ESPI 1.1 Atom XML against PG&E's own published XSDs, and
  the resource tree is the NAESB REQ.21 / Green Button Connect My Data resource model verbatim.
  Nothing here is inferred from marketing prose.
conformance:
  - id: naesb-espi-1.1
    name: NAESB REQ.21 Energy Service Provider Interface (ESPI) 1.1
    conforms: true
    evidence: >-
      Every documented resource sits under /GreenButtonConnect/espi/1_1/resource/ and the published
      supported-API reference labels each row with its ESPI function block ([FB_32] Resource Level
      REST, [FB_35] REST for Bulk, [FB_46] Core RetailCustomer, [FB_47] REST for RetailCustomer
      Bulk).
    source: https://www.pge.com/assets/pge/docs/save-energy-and-money/energy-savings-programs/Supported-APIs.pdf
  - id: green-button-connect-my-data
    name: Green Button Connect My Data (CMD)
    conforms: true
    evidence: >-
      PG&E's published function-block mapping enumerates the Green Button ESPI function blocks it
      supports (1, 3, 4, 5, 8, 10, 13, 14, 15, 16, 18, 19, 31, 32, 35, 37, 38, 39, 40, 46, 47) and
      names PG&E as dataCustodianId=PGE in the scope string.
    source: https://www.pge.com/assets/pge/docs/save-energy-and-money/energy-savings-programs/Supported-Function-Block-Scope-String-Mapping-Click-Thru-2.0.pdf
  - id: oauth2
    name: OAuth 2.0 (RFC 6749)
    conforms: true
    evidence: >-
      Live RFC 6749 error envelopes observed anonymously 2026-09-17: GET on the production token
      endpoint returns HTTP 405 {"error":"invalid_request","error_description":"GET not permitted"};
      the test token endpoint returns HTTP 400 {"error":"invalid_request","error_description":"Missing
      grant_type"}. authorization_code, client_credentials and refresh_token grants are documented.
    source: https://api.pge.com/datacustodian/oauth/v2/token
  - id: oidc
    name: OpenID Connect
    conforms: false
    evidence: >-
      /.well-known/openid-configuration returns HTTP 404 on www.pge.com, api.pge.com and
      sharemydata.pge.com (probed 2026-09-17). This is plain OAuth 2.0.
  - id: mutual-tls
    name: Mutual TLS 1.2 with client X.509 certificate
    conforms: true
    evidence: >-
      Anonymous GET on every /GreenButtonConnect/espi/1_1/resource/ path returns HTTP 400
      "Invalid Certificate". PG&E's registration page requires a TLS 1.2 X.509 certificate from a
      recognized SSL provider and rejects self-signed certificates.
    source: https://api.pge.com/GreenButtonConnect/espi/1_1/resource/ReadServiceStatus
  - id: rfc9457
    name: RFC 9457 Problem Details for HTTP APIs
    conforms: false
    evidence: >-
      Error bodies are either an OAuth 2.0 error object or a bare JSON string ("Invalid
      Certificate"); no application/problem+json is served.
  - id: xml-schema
    name: W3C XML Schema (ESPI / Share My Data XSDs)
    conforms: true
    evidence: >-
      PG&E publishes the ESPI and Share My Data XSD bundle anonymously (HTTP 200, 50,187 bytes).
      This is the only machine-readable contract PG&E ships.
    source: https://www.pge.com/assets/pge/docs/save-energy-and-money/energy-savings-programs/SMD_XSDs.zip
  - id: atom-syndication
    name: Atom Syndication Format (RFC 4287)
    conforms: true
    evidence: >-
      ESPI 1.1 responses are Atom feeds of entries; the supported-API reference describes GET
      results as "feed" resources (e.g. "Request feed of all authorizations of 3rd party").
    source: https://www.pge.com/assets/pge/docs/save-energy-and-money/energy-savings-programs/Supported-APIs.pdf
domain_standard:
  market: United States regulated electric and gas distribution utility — customer energy usage data
  standard: NAESB REQ.21 ESPI 1.1 / Green Button Connect My Data
  declared_in_contract: true
  signature: >-
    The authorization scope returned by the token endpoint IS an ESPI function-block string
    (FB=1_3_8_13_14_18_19_31_32_35_37_38_39_40_4_5_10_15_16_46_47;AdditionalScope=...;
    dataCustodianId=PGE), and the resource tree is the ESPI resource model. A counterparty that
    already speaks Green Button integrates with no bespoke connector.
  evidence:
    - https://www.pge.com/assets/pge/docs/save-energy-and-money/energy-savings-programs/Supported-Function-Block-Scope-String-Mapping-Click-Thru-2.0.pdf
    - https://www.pge.com/assets/pge/docs/save-energy-and-money/energy-savings-programs/Supported-APIs.pdf
compliance:
  - name: California Public Utilities Code section 8380 (SB 1476)
    type: statute
    note: California statutory basis for customer energy-data privacy and third-party access.
  - name: CPUC Customer Data Access Tariff / Share My Data
    type: tariff
    note: >-
      Third parties must be in eligible standing with the California Public Utilities Commission and
      accept the filed tariff before approval.
    source: https://www.pge.com/en/save-energy-and-money/energy-saving-programs/smartmeter/third-party-companies.html
  - name: CPUC Decision on privacy and security rules for energy usage data
    type: regulatory decision
    source: https://docs.cpuc.ca.gov/word_pdf/FINAL_DECISION/140369.pdf
  - name: Share My Data Platform Terms of Use
    type: contract
    source: https://www.pge.com/assets/pge/docs/save-energy-and-money/energy-savings-programs/smd-platform-tou.pdf
certifications:
  published: false
  note: >-
    No SOC 2 / ISO 27001 / PCI / HIPAA / FedRAMP attestation is published for the Share My Data
    platform, and no trust center exists. Assurance here is regulatory (CPUC tariff) rather than
    audit-certificate based.
